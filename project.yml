name: Lumen
options:
  bundleIdPrefix: com.lyonecho
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Lumen:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Lumen
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lyonecho.lumen
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Lumen reads your Health data (sleep, activity, heart, and body metrics) to compute your daily Life Score. It stays on your device and is never uploaded."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Lumen does not write any data to Health."
    entitlements:
      path: Lumen/Lumen.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.lyonecho.lumen
    dependencies:
      - target: LumenActivityReport
        embed: true
      - target: LumenActivityMonitor
        embed: true
  LumenActivityReport:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LumenActivityReport
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lyonecho.lumen.activityreport
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: LumenActivityReport/Info.plist
      properties:
        CFBundleDisplayName: Focus
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    entitlements:
      path: LumenActivityReport/LumenActivityReport.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.lyonecho.lumen
  LumenActivityMonitor:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LumenActivityMonitor
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lyonecho.lumen.activitymonitor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: LumenActivityMonitor/Info.plist
      properties:
        CFBundleDisplayName: Focus Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).LumenActivityMonitor
    entitlements:
      path: LumenActivityMonitor/LumenActivityMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.lyonecho.lumen
